# Configuration declarative des flux ETL Mongo -> MySQL.
#
# Schema cible corrige a partir du dump reel de la base tsa_activities
# (mysqldump fourni par l'utilisateur le 2026-07-02) et croisement avec les
# 4 scripts R legacy (old_automate/). Convention confirmee dans TOUS les
# scripts R : le champ Mongo `_id` est stocke sous le nom `X_id`, et un
# split `Date`/`Time` est systematiquement ajoute a partir du champ date
# (voir add_date_time_split / rename_id_to sur chaque flux ci-dessous).
#
# Pour ajouter un flux : ajouter une entree ici, aucun changement de code
# Python necessaire.

flows:

  - name: tsa_reports
    source_collection: reports
    target_database: tsa_activities
    target_table: tsa_reports
    primary_key: X_id
    rename_id_to: X_id
    add_date_time_split: true
    date_field: createdAt
    bootstrap_start_date: "2025-01-01"
    projection:
      posId: 1
      userInfo.firstName: 1
      userInfo.lastName: 1
      userInfo.phoneNumber: 1
      userInfo._id: 1
      userInfo.corporateNumber: 1
      posInfo.posNumber: 1
      posInfo.ownerName: 1
      posInfo.ownerLastName: 1
      posInfo.typePos: 1
      posInfo.posAgentNumber: 1
      posInfo.posMerchantNumber: 1
      posInfo.ownerLastNumber: 1
      posInfo.kindOfPos: 1
      posInfo.activityPeriod: 1
      posInfo.activityHour: 1
      createdAt: 1
      catPDV: 1
      eCashMTN: 1
      cashinMTN: 1
      cashoutMTN: 1
      airtimeMTN: 1
      simNumberMTN: 1
      longitude: 1
      latitude: 1
      typeReport: 1
      etsName: 1
      tsaName: 1
      tsaLastName: 1
      eCashMoov: 1
      eCashCeltiis: 1
      cashinMOOV: 1
      cashinCeltiis: 1
      cashoutMOOV: 1
      cashoutCeltiis: 1
      airtimeMOOV: 1
      airtimeCeltiis: 1
      simNumberMOOV: 1
      simNumberCeltiis: 1
      visibiltyState: 1
      frequencyMTN: 1
      frequencyMOOV: 1
      frequencyCeltiis: 1

  - name: tsa_deployments
    # CORRECTION (2026-07-02) : la source reelle est la collection `pos`,
    # pas `activities` comme suppose initialement. Confirme par le dump reel
    # (colonnes agentInfo_*, posAgentNumber, type='deployment'/'Non') et par
    # verification directe sur Mongo : agentInfo est bien peuple nativement
    # sur les documents pos, et le champ `type` existe (285547/330886 docs).
    source_collection: pos
    target_database: tsa_activities
    target_table: tsa_deployments
    primary_key: X_id
    rename_id_to: X_id
    add_date_time_split: true
    date_field: createdAt
    bootstrap_start_date: "2025-01-01"
    # Pas de filtre/projection : export complet confirme par le referent
    # (comme pos l'etait deja dans le handoff). La table brute contient les
    # deux valeurs de `type` ('Non' et 'deployment') ; le filtre
    # type='deployment' est applique cote vue SQL (tsa_monthly_performance),
    # pas a l'extraction.

  - name: vente_sim
    source_collection: bareports
    type_field: type
    type_filter: bs-vente-sim
    # CORRECTION (2026-07-03) : base BRAND_SOLDIER_ACTIVITIES (pas TSA_ACTIVITIES),
    # confirme par Brand_ambasador_dataload_lka2.0.R (dbname="BRAND_SOLDIER_ACTIVITIES").
    target_database: brand_soldier_activities
    # CORRECTION (2026-07-03) : casse exacte du dump brand_soldier_activities
    # (lower_case_table_names=0 sur ce serveur -> la casse compte).
    target_table: vente_sim
    primary_key: X_id
    rename_id_to: X_id
    add_date_time_split: true
    date_field: createdAt
    bootstrap_start_date: "2025-01-01"
    badge_merge: true
    dedup_key: numSim
    phone_min_length: 8
    projection:
      userInfo.idUnique: 1
      userInfo.numeroBadge: 1
      createdAt: 1
      numSim: 1
      statusSimVendue: 1
      compteMomo: 1
      statusMomo: 1
      depotInitial: 1
      activationForfait: 1
      typeForfait: 1
      montantForfait: 1
      modeActivation: 1
      region: 1
      newUserData: 1
      moovNumberCalled: 1
      moovNumberCalling: 1
      typeBa: 1
      userInfo.superviseurIdUnique: 1

  - name: dtc_activation
    source_collection: bareports
    type_field: type
    type_filter: bs-dtc-activation
    # CORRECTION (2026-07-03) : base BRAND_SOLDIER_ACTIVITIES (pas TSA_ACTIVITIES).
    target_database: brand_soldier_activities
    # CORRECTION (2026-07-03) : casse+orthographe exactes du dump (dtc_exisiting,
    # pas DTC_EXISITING - lower_case_table_names=0 sur ce serveur).
    target_table: dtc_exisiting
    primary_key: X_id
    rename_id_to: X_id
    add_date_time_split: true
    date_field: createdAt
    bootstrap_start_date: "2025-01-01"
    badge_merge: true
    dedup_key: numClient
    phone_min_length: 8
    projection:
      userInfo.idUnique: 1
      userInfo.numeroBadge: 1
      createdAt: 1
      numClient: 1
      montantDepot: 1
      posCompteAbonne: 1
      serviceAchete: 1
      zone: 1
      region: 1
      typeBa: 1
      userInfo.superviseurIdUnique: 1

  - name: zotcheze
    source_collection: bareports
    type_field: type
    type_filter: bs-zotcheze
    # Aucune table legacy connue pour ce flux, mais meme famille metier
    # (Brand Ambassador) que vente_sim/dtc_activation -> meme base.
    target_database: brand_soldier_activities
    # CORRECTION (2026-07-03) : minuscule par coherence avec les autres
    # tables de cette base (lower_case_table_names=0 sur ce serveur).
    target_table: zotcheze
    primary_key: X_id
    rename_id_to: X_id
    add_date_time_split: true
    date_field: createdAt
    bootstrap_start_date: "2025-01-01"
    badge_merge: true
    dedup_key: numClient
    phone_min_length: 8
    projection:
      userInfo.idUnique: 1
      userInfo.numeroBadge: 1
      createdAt: 1
      numClient: 1
      senderNumber: 1
      montant: 1
      posCompteAbonne: 1
      forfait: 1
      comment: 1
      region: 1
      typeBa: 1
      userInfo.superviseurIdUnique: 1

  - name: ayoba
    # Ajoute le 2026-07-06 (a la demande de l'utilisateur). CORRECTION par
    # rapport aux autres flux BA (vente_sim/dtc_activation/zotcheze) : pas de
    # projection restrictive ici - le dump reel de la table 'ayoba' confirme
    # que TOUT le sous-document userInfo est aplati en colonnes (userInfo_role_*,
    # userInfo_region_*, userInfo_superviseur*, userInfo_isBanned, etc.), pas
    # seulement idUnique/numeroBadge/superviseurIdUnique comme pour les autres
    # flux BA. Export complet (comme tsa_deployments), pas de projection.
    source_collection: bareports
    type_field: type
    type_filter: bs-ayoba
    target_database: brand_soldier_activities
    target_table: ayoba
    primary_key: X_id
    rename_id_to: X_id
    add_date_time_split: true
    date_field: createdAt
    bootstrap_start_date: "2025-01-01"
    badge_merge: true
    dedup_key: numClient
    phone_min_length: 8

  - name: maj
    # Ajoute le 2026-07-03 : manquait. Source Mongo = bareports/bs-update
    # ('MAJ' = Mise A Jour = 'update'). Champs disponibles plus pauvres
    # que ayoba/vente_sim (pas de sous-document userInfo aussi riche cote
    # deduplication) - le referent Gerrish devra confirmer si les colonnes
    # legacy 'Numero_Badge'/'Username_BA'/'Contact_abonne' correspondent
    # exactement a ces champs Mongo ou necessitent un mapping different.
    source_collection: bareports
    type_field: type
    type_filter: bs-update
    target_database: brand_soldier_activities
    target_table: maj
    primary_key: X_id
    rename_id_to: X_id
    add_date_time_split: true
    date_field: createdAt
    bootstrap_start_date: "2025-01-01"
    dedup_key: numClient
    phone_min_length: 8
    projection:
      agent: 1
      agentId: 1
      city: 1
      comment: 1
      createdAt: 1
      numClient: 1
      region: 1
      userInfo.idUnique: 1
      userInfo.numeroBadge: 1
      userInfo.superviseurIdUnique: 1

  - name: mtn_hype
    # Ajoute le 2026-07-03 : manquait. Source = bareports/bs-hype (2.5M
    # docs, largement plus gros volume que la collection separee 'hypepos'
    # utilisee jusqu'ici pour un flux different) - coherent avec le choix
    # deja fait pour vente_sim/dtc_activation/ayoba/maj (tous sourced
    # depuis bareports, pas les petites collections dediees).
    source_collection: bareports
    type_field: type
    type_filter: bs-hype
    target_database: brand_soldier_activities
    target_table: mtn_hype
    primary_key: X_id
    rename_id_to: X_id
    add_date_time_split: true
    date_field: createdAt
    bootstrap_start_date: "2025-01-01"
    badge_merge: true
    dedup_key: numClient
    phone_min_length: 8
    projection:
      userInfo.idUnique: 1
      userInfo.numeroBadge: 1
      userInfo.superviseurIdUnique: 1
      createdAt: 1
      numClient: 1
      forfait: 1
      montant: 1
      region: 1
      city: 1
