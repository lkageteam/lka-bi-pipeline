name: ETL Sync

on:
  workflow_dispatch:
    inputs:
      flows:
        description: "Flux a executer (separes par des espaces), vide = tous"
        required: false
        default: ""
      dry_run:
        description: "Dry run (pas d'ecriture MySQL)"
        required: false
        default: "false"
      connection_mode:
        description: "Chemin de connexion MySQL a utiliser"
        required: false
        type: choice
        default: ssh_tunnel
        options:
          - direct
          - wireguard
          - ssh_tunnel
  schedule:
    # Toutes les 6h. ssh_tunnel est le seul mode fiable observe depuis les
    # runners GitHub Actions (direct/wireguard echouent totalement de facon
    # intermittente, cf. historique) - impose ci-dessous via CONNECTION_MODE
    # car un evenement 'schedule' n'a pas d'inputs (contrairement a
    # workflow_dispatch), donc pas de connection_mode choisi.
    - cron: "0 */6 * * *"

concurrency:
  group: etl-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 90 min : le premier chargement (bootstrap) de tsa_reports (2.78M docs)
    # a deja pris ~31 min a lui seul (2026-07-02). Les runs incrementaux
    # suivants seront bien plus courts (cf. sync_state).
    timeout-minutes: 90
    env:
      # Fallback ssh_tunnel : couvre a la fois le declenchement 'schedule'
      # (pas d'inputs du tout) et un workflow_dispatch sans connection_mode
      # explicite.
      CONNECTION_MODE: ${{ github.event.inputs.connection_mode || 'ssh_tunnel' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Monter le tunnel WireGuard
        if: ${{ env.CONNECTION_MODE == 'wireguard' }}
        env:
          WG_CI_PRIVATE_KEY: ${{ secrets.WG_CI_PRIVATE_KEY }}
          WG_SERVER_PUBLIC_KEY: ${{ secrets.WG_SERVER_PUBLIC_KEY }}
          WG_SERVER_ENDPOINT: ${{ vars.WG_SERVER_ENDPOINT }}
          WG_CLIENT_ADDRESS: ${{ vars.WG_CLIENT_ADDRESS }}
        run: bash scripts/wireguard_up.sh

      - name: Monter le tunnel SSH
        if: ${{ env.CONNECTION_MODE == 'ssh_tunnel' }}
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          # Cle privee ed25519 (preferee) ; le mot de passe reste en repli
          # tant que la cle publique n'est pas installee sur le serveur.
          # Pourquoi : fenetres de refus de l'auth mot de passe cote VPS,
          # cf. D:\LKA\MYSQL_CONNECTION_METHODS.md §6.
          SSH_PKEY: ${{ secrets.SSH_PKEY }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
          MYSQL_PORT: ${{ vars.MYSQL_PORT }}
        run: bash scripts/ssh_tunnel_up.sh

      - name: Executer le pipeline ETL
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ vars.MONGO_DB_NAME }}
          MYSQL_HOST: ${{ env.CONNECTION_MODE == 'wireguard' && vars.MYSQL_HOST_TUNNEL || (env.CONNECTION_MODE == 'ssh_tunnel' && '127.0.0.1' || vars.MYSQL_HOST_DIRECT) }}
          MYSQL_PORT: ${{ vars.MYSQL_PORT }}
          MYSQL_USER: ${{ vars.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}
          FLOWS_INPUT: ${{ github.event.inputs.flows }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$FLOWS_INPUT" ]; then
            # FLOWS_INPUT est fourni virgule-separe (ex: "a,b,c") depuis
            # workflow_dispatch, mais argparse --flows (nargs="*") attend des
            # arguments espace-separes - sans cette conversion, tout le
            # contenu arrive comme un seul token qui ne matche aucun flow.name
            # (bug reel observe : run 28653323736, "0 flux" traites malgre
            # flows="vente_sim,dtc_activation,zotcheze,maj,mtn_hype" fourni).
            ARGS="--flows $(echo "$FLOWS_INPUT" | tr ',' ' ')"
          fi
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m src.etl.pipeline $ARGS

      - name: Synchroniser newadd/ads/numenclature (source lka_perf_commissions + lka_client_mtn, meme serveur)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          MYSQL_HOST: ${{ env.CONNECTION_MODE == 'wireguard' && vars.MYSQL_HOST_TUNNEL || (env.CONNECTION_MODE == 'ssh_tunnel' && '127.0.0.1' || vars.MYSQL_HOST_DIRECT) }}
          MYSQL_PORT: ${{ vars.MYSQL_PORT }}
          MYSQL_USER: ${{ vars.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}
          # Seuil (mois) au-dela duquel un agent sans activite recente est
          # marque inactif dans numenclature - variable pour pouvoir
          # l'ajuster sans toucher au code (demande utilisateur, 2026-07-07).
          INACTIVE_MONTHS: ${{ vars.INACTIVE_MONTHS || '3' }}
        run: python -m src.etl.sql_source

      - name: Fermer le tunnel WireGuard
        if: ${{ always() && env.CONNECTION_MODE == 'wireguard' }}
        run: sudo wg-quick down wg0 || true

      - name: Fermer le tunnel SSH
        if: ${{ always() && env.CONNECTION_MODE == 'ssh_tunnel' }}
        run: pkill -f "ssh -N -f" || true
