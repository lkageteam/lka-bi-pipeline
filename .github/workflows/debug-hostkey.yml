name: Debug HostKey (temporaire)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Tester IPv6 + epinglage de cle hote
        env:
          SSH_PKEY: ${{ secrets.SSH_PKEY }}
        run: |
          python3 -m pip install -q paramiko
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PKEY" > ~/.ssh/k && chmod 600 ~/.ssh/k
          echo "--- connectivite IPv6 du runner ---"
          curl -s --max-time 8 -6 https://api64.ipify.org && echo "  <- IPv6 sortante OK" || echo "  runner SANS IPv6"
          python3 - <<'PY'
          import base64, hashlib, socket, time
          import paramiko
          from pathlib import Path
          from collections import Counter
          GOOD = "1Agcd+p8/B2xglBgm1FkIRTzIHBZ5iGNzKuj3Qsz/5Y"
          KEY = paramiko.Ed25519Key.from_private_key_file(str(Path.home()/".ssh"/"k"))

          def probe(host, family, label, n=10):
              res = Counter()
              for i in range(n):
                  t = None
                  try:
                      ai = socket.getaddrinfo(host, 22, family, socket.SOCK_STREAM)[0]
                      s = socket.socket(ai[0], ai[1]); s.settimeout(8); s.connect(ai[4])
                      t = paramiko.Transport(s); t.start_client(timeout=8)
                      k = t.get_remote_server_key()
                      fp = base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip("=")
                      if fp != GOOD:
                          res["MAUVAISE_MACHINE"] += 1
                      else:
                          t.auth_publickey("root", KEY)
                          res["OK"] += 1
                  except Exception as e:
                      res[f"ERR:{type(e).__name__}"] += 1
                  finally:
                      if t: t.close()
                  time.sleep(1)
              print(f"{label}: {dict(res)}")

          probe("75.119.154.255", socket.AF_INET, "IPv4 (avec epinglage)")
          try:
              probe("2a02:c207:2270:5246::1", socket.AF_INET6, "IPv6 (avec epinglage)")
          except Exception as e:
              print("IPv6 indisponible:", e)
          PY
