name: Debug Drive (temporaire)
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Inventaire du dossier Drive (dates + sous-dossiers)
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
        run: |
          python - <<'PY'
          import os, json
          from src.etl.drive_sync import DriveClient
          c = DriveClient()
          svc, fid = c.service, c.folder_id

          def ls(folder_id, prefix=""):
              out, tok = [], None
              while True:
                  r = svc.files().list(
                      q=f"'{folder_id}' in parents and trashed = false",
                      fields="nextPageToken, files(id,name,mimeType,modifiedTime,size)",
                      pageToken=tok, orderBy="name").execute()
                  out += r.get("files", [])
                  tok = r.get("nextPageToken")
                  if not tok: break
              return out

          print(f"=== DOSSIER SURVEILLE ({fid}) ===")
          items = ls(fid)
          folders = [f for f in items if f["mimeType"].endswith("folder")]
          files = [f for f in items if not f["mimeType"].endswith("folder")]
          print(f"{len(files)} fichier(s), {len(folders)} sous-dossier(s)\n")
          print(f"{'MODIFIE LE':22} {'NOM'}")
          for f in sorted(files, key=lambda x: x["modifiedTime"], reverse=True):
              print(f"{f['modifiedTime'][:19]:22} {f['name']}")

          for d in folders:
              print(f"\n=== SOUS-DOSSIER (NON SYNCHRONISE) : {d['name']} ===")
              for f in sorted(ls(d["id"]), key=lambda x: x["modifiedTime"], reverse=True)[:25]:
                  print(f"{f['modifiedTime'][:19]:22} {f['name']}")

          print("\n=== RECHERCHE GLOBALE 'merchant' (tout le Drive accessible) ===")
          r = svc.files().list(
              q="name contains 'erchant' and trashed = false",
              fields="files(id,name,modifiedTime,parents,mimeType)",
              orderBy="modifiedTime desc", pageSize=25).execute()
          hits = r.get("files", [])
          if not hits:
              print("aucun fichier contenant 'merchant' visible par le compte de service")
          for f in hits:
              par = (f.get("parents") or ["?"])[0]
              where = "DOSSIER SURVEILLE" if par == fid else f"autre dossier ({par})"
              print(f"{f['modifiedTime'][:19]}  {f['name']}  -> {where}")
          PY
