name: Auto Retry Sync

# Relance automatiquement un run ETL Sync / Excel Sync qui a echoue.
#
# POURQUOI (2026-07-16) : run 29481386042 - les 15 tentatives SSH sur ~5 min
# ont TOUTES ete refusees "Permission denied" (mot de passe correct), alors
# que le cron precedent et le suivant, sur d'autres runners, sont passes.
# 3 crons ETL sur 8 ont echoue ainsi en 48h. Le pattern (refus soutenu pour
# une IP donnee, succes immediat depuis une autre IP) pointe vers un ban
# d'IP cote serveur (fail2ban / anti-abus hebergeur), vraisemblablement
# declenche par nos propres retries en mot de passe : apres quelques echecs
# transitoires, l'IP du runner est bannie et TOUTES les tentatives suivantes
# du meme job sont refusees d'office. Insister depuis la meme IP est donc
# inutile ; la parade est de rejouer le job sur un runner NEUF (= nouvelle
# IP), ce que fait ce workflow.
on:
  workflow_run:
    workflows: ["ETL Sync", "Excel Sync (Google Drive)"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    runs-on: ubuntu-latest
    # Max 3 tentatives au total (1 run initial + 2 relances) : si ca echoue
    # 3 fois depuis 3 IP differentes, c'est une vraie panne serveur - on
    # laisse le prochain cron reessayer plutot que de marteler.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    steps:
      - name: Attendre puis relancer les jobs echoues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          REPO: ${{ github.repository }}
        run: |
          # Petit delai avant relance : laisse retomber un eventuel ban/panne
          # courte cote serveur. Le runner de la relance aura de toute facon
          # une IP differente.
          echo "Run $RUN_ID echoue (tentative $ATTEMPT). Relance dans 3 min..."
          sleep 180
          gh run rerun "$RUN_ID" --failed --repo "$REPO"
          echo "Relance demandee (tentative $((ATTEMPT + 1)))."
